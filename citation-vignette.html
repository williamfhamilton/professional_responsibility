<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Citation</title>
<style>
  :root {
    --text-primary: #1a1a1a;
    --text-secondary: #5f5e5a;
    --text-muted: #888780;
    --border: #d8d6cf;
    --surface-1: #f7f6f2;
    --surface-2: #ffffff;
    --accent: #185fa5;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text-primary);
    background: var(--surface-1);
    max-width: 720px;
    margin: 0 auto;
    padding: 2rem 1.25rem 3rem;
    line-height: 1.6;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 0.25rem; }
  .subtitle { font-size: 14px; color: var(--text-secondary); margin: 0 0 1.5rem; }
  .progress { display: flex; gap: 6px; margin-bottom: 1.5rem; }
  .progress div { flex: 1; height: 4px; border-radius: 2px; background: var(--border); }
  .progress div.done { background: var(--accent); }
  .round-card {
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-left: 4px solid var(--round-color, var(--accent));
  }
  .round-label { font-size: 13px; font-weight: 600; margin: 0 0 6px; color: var(--round-color, var(--accent)); }
  .round-facts { font-size: 15px; margin: 0 0 12px; }
  .round-question { font-size: 14px; color: var(--text-secondary); font-style: italic; margin: 0; }
  textarea {
    width: 100%;
    margin-bottom: 1.5rem;
    padding: 10px;
    font-size: 14px;
    font-family: inherit;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-primary);
    resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font-weight: 600;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-primary);
    cursor: pointer;
  }
  button:hover { background: var(--surface-1); }
  button:active { transform: scale(0.98); }
  .debrief {
    border-top: 1px solid var(--border);
    padding-top: 1rem;
    margin-top: 0.5rem;
  }
  .debrief p { font-size: 15px; margin: 0 0 8px; }
  .debrief .sub { font-size: 14px; color: var(--text-secondary); }
  .fault-line { font-size: 13px; color: var(--text-muted); margin-top: 12px; }
</style>
</head>
<body>

<h1>The Citation</h1>
<p class="subtitle">Read each round, write your own answer before moving on, then continue to see the next fact.</p>

<div class="progress" id="progress"></div>
<div id="rounds"></div>

<div style="display:flex; gap:8px; margin-top:1.25rem;">
  <button id="nextBtn">Continue to next round</button>
  <button id="resetBtn" style="display:none;">Start over</button>
</div>

<script>
const rounds = [
  {
    label: "Round 1",
    color: "#888780",
    facts: "You've filed a brief citing a case that supports your argument. Preparing for oral argument two weeks later, you discover the case was reversed on appeal after your brief was filed, and the reversal directly undercuts your argument. Opposing counsel hasn't caught it. The court hasn't caught it.",
    question: "Do you say anything, to anyone? What, specifically, and to whom?"
  },
  {
    label: "Round 2",
    color: "#b07a17",
    facts: "New fact: on closer read, the case is technically distinguishable on its facts, and your argument still basically works without it, just less cleanly, and with less authority behind it.",
    question: "Does this change your answer? Does having a fallback argument reduce what you owe the court about the case you actually cited?"
  },
  {
    label: "Round 3",
    color: "#b5551d",
    facts: "New fact: correcting the record doesn't just weaken your argument. It would likely hand the court a clean basis to grant opposing counsel's motion outright, and your client would lose the case, not just this point.",
    question: "Has your answer changed? Is the size of what your client stands to lose relevant to what candor requires of you?"
  },
  {
    label: "Round 4",
    color: "#a32d2d",
    facts: "New fact: oral argument is in two days. You tell your client what you found. Your client explicitly instructs you not to raise it with the court.",
    question: "Final answer. What do you do? Whose instruction controls here: the client's, or a duty that the client can't waive on your behalf?"
  }
];

let current = 0;
const answers = ["", "", "", ""];

function renderProgress() {
  const el = document.getElementById('progress');
  el.innerHTML = '';
  rounds.forEach((r, i) => {
    const dot = document.createElement('div');
    if (i <= current) dot.className = 'done';
    el.appendChild(dot);
  });
}

function renderRounds() {
  const container = document.getElementById('rounds');
  container.innerHTML = '';
  for (let i = 0; i <= current; i++) {
    const r = rounds[i];
    const card = document.createElement('div');
    card.className = 'round-card';
    card.style.setProperty('--round-color', r.color);
    card.innerHTML =
      '<p class="round-label">' + r.label + '</p>' +
      '<p class="round-facts">' + r.facts + '</p>' +
      '<p class="round-question">' + r.question + '</p>';
    container.appendChild(card);

    const ta = document.createElement('textarea');
    ta.placeholder = "Write your answer here before moving on...";
    ta.value = answers[i];
    ta.rows = 3;
    ta.addEventListener('input', (e) => { answers[i] = e.target.value; });
    container.appendChild(ta);
  }

  if (current === rounds.length - 1) {
    const debrief = document.createElement('div');
    debrief.className = 'debrief';
    debrief.innerHTML =
      '<p><b>Debrief.</b> Ask whether your Round 1 answer already contained your Round 4 answer, or whether the stakes in Rounds 3 and 4 actually changed the underlying obligation.</p>' +
      '<p class="sub">Most people find that the duty of candor doesn\'t move at all across the four rounds. What moves is how much it costs to comply with it, and how tempting it becomes to tell yourself the obligation has changed when really only the price has.</p>' +
      '<p class="fault-line">Fault line: candor to the tribunal versus loyalty to the client.</p>';
    container.appendChild(debrief);
  }
}

document.getElementById('nextBtn').addEventListener('click', () => {
  if (current < rounds.length - 1) {
    current++;
    renderProgress();
    renderRounds();
    if (current === rounds.length - 1) {
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('resetBtn').style.display = 'inline-block';
    }
  }
});

document.getElementById('resetBtn').addEventListener('click', () => {
  current = 0;
  for (let i = 0; i < answers.length; i++) answers[i] = '';
  document.getElementById('nextBtn').style.display = 'inline-block';
  document.getElementById('resetBtn').style.display = 'none';
  renderProgress();
  renderRounds();
});

renderProgress();
renderRounds();
</script>

</body>
</html>
