<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Front Desk</title>
<style>
  :root {
    --text-primary: #1a1a1a;
    --text-secondary: #5f5e5a;
    --text-muted: #888780;
    --border: #d8d6cf;
    --surface-1: #f7f6f2;
    --surface-2: #ffffff;
    --accent: #185fa5;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text-primary);
    background: var(--surface-1);
    max-width: 720px;
    margin: 0 auto;
    padding: 2rem 1.25rem 3rem;
    line-height: 1.6;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 0.25rem; }
  .subtitle { font-size: 14px; color: var(--text-secondary); margin: 0 0 1.5rem; }
  .progress { display: flex; gap: 6px; margin-bottom: 1.5rem; }
  .progress div { flex: 1; height: 4px; border-radius: 2px; background: var(--border); }
  .progress div.done { background: var(--accent); }
  .round-card {
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-left: 4px solid var(--round-color, var(--accent));
  }
  .round-label { font-size: 13px; font-weight: 600; margin: 0 0 6px; color: var(--round-color, var(--accent)); }
  .round-facts { font-size: 15px; margin: 0 0 12px; }
  .round-question { font-size: 14px; color: var(--text-secondary); font-style: italic; margin: 0; }
  textarea {
    width: 100%;
    margin-bottom: 1.5rem;
    padding: 10px;
    font-size: 14px;
    font-family: inherit;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-primary);
    resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font-weight: 600;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-primary);
    cursor: pointer;
  }
  button:hover { background: var(--surface-1); }
  button:active { transform: scale(0.98); }
  .debrief {
    border-top: 1px solid var(--border);
    padding-top: 1rem;
    margin-top: 0.5rem;
  }
  .debrief p { font-size: 15px; margin: 0 0 8px; }
  .debrief .sub { font-size: 14px; color: var(--text-secondary); }
  .fault-line { font-size: 13px; color: var(--text-muted); margin-top: 12px; }
</style>
</head>
<body>

<h1>The Front Desk</h1>
<p class="subtitle">Read each round, write your own answer before moving on, then continue to see the next fact.</p>

<div class="progress" id="progress"></div>
<div id="rounds"></div>

<div style="display:flex; gap:8px; margin-top:1.25rem;">
  <button id="nextBtn">Continue to next round</button>
  <button id="resetBtn" style="display:none;">Start over</button>
</div>

<script>
const rounds = [
  {
    label: "Round 1",
    color: "#888780",
    facts: "You work the front desk at a legal aid clinic that serves people who can't afford a lawyer. You're not a paralegal and have no formal legal training, but after four years on the job you know the court-approved forms better than almost anyone in the building. When someone comes in for a name change or an uncontested small claim, you hand them the state's approved form and type up exactly what they tell you onto the blanks.",
    question: "Is this a professional responsibility question at all, or just what a competent front-desk job looks like?"
  },
  {
    label: "Round 2",
    color: "#b07a17",
    facts: "New fact: people keep asking you which box to check. Today a woman with a landlord dispute asks whether she should check \"material breach of lease\" or \"constructive eviction\" on the form. Nobody has explained the difference to her, and there's no attorney in the building today. You tell her what each term generally means so she can decide for herself.",
    question: "Have you crossed a line? Does it matter that you explained the terms rather than telling her which one to pick?"
  },
  {
    label: "Round 3",
    color: "#c1440e",
    facts: "New fact: a man walks in an hour before closing with a three-day eviction notice that expires tomorrow morning. No attorney is reachable by phone. You read the notice and you're fairly sure it doesn't give him the number of days the statute requires. You tell him that, and help him draft a one-page response citing the statute, using language you've seen attorneys use in similar filings before.",
    question: "Do you help him file it tonight, or send him away with nothing before his deadline passes? Is there a third option?"
  },
  {
    label: "Round 4",
    color: "#a32d2d",
    facts: "New fact, three weeks later: a different client you helped the same way lost her case anyway, on a procedural point a lawyer would have caught — the kind of issue nobody without legal training would think to look for. The clinic has one attorney and forty people in the waiting room most Tuesdays. Turning people away means most of them get no help of any kind.",
    question: "Final answer. What do you do at the front desk tomorrow, when the next person walks in with no lawyer, no money, and no time? Is imperfect help better or worse than no help at all — and is that even the right question to be asking?"
  }
];

let current = 0;
const answers = ["", "", "", ""];

function renderProgress() {
  const el = document.getElementById('progress');
  el.innerHTML = '';
  rounds.forEach((r, i) => {
    const dot = document.createElement('div');
    if (i <= current) dot.className = 'done';
    el.appendChild(dot);
  });
}

function renderRounds() {
  const container = document.getElementById('rounds');
  container.innerHTML = '';
  for (let i = 0; i <= current; i++) {
    const r = rounds[i];
    const card = document.createElement('div');
    card.className = 'round-card';
    card.style.setProperty('--round-color', r.color);
    card.innerHTML =
      '<p class="round-label">' + r.label + '</p>' +
      '<p class="round-facts">' + r.facts + '</p>' +
      '<p class="round-question">' + r.question + '</p>';
    container.appendChild(card);

    const ta = document.createElement('textarea');
    ta.placeholder = "Write your answer here before moving on...";
    ta.value = answers[i];
    ta.rows = 3;
    ta.addEventListener('input', (e) => { answers[i] = e.target.value; });
    container.appendChild(ta);
  }

  if (current === rounds.length - 1) {
    const debrief = document.createElement('div');
    debrief.className = 'debrief';
    debrief.innerHTML =
      '<p><b>Debrief.</b> Look back at your four answers. Find the round where you first felt like you\'d have to say no — then ask whether that round was actually different in kind from Round 1, or just different in degree.</p>' +
      '<p class="sub">Nothing about the underlying rule moved across these four rounds. What moved was how easy it felt to call clerical help "legal advice" once turning someone away started to feel like the more harmful choice.</p>' +
      '<p class="sub">This is the same fault line as the multiple choice question about Alex Martinez — but here the person at the line is unpaid, well-intentioned, and standing between someone and the total absence of help. The doctrine doesn\'t carve out an exception for that. Whether it should is a separate, harder question, and one the profession hasn\'t settled.</p>' +
      '<p class="fault-line">Fault line: unauthorized practice of law — the line between clerical assistance and legal judgment, tested against the reality of unmet legal need.</p>';
    container.appendChild(debrief);
  }
}

document.getElementById('nextBtn').addEventListener('click', () => {
  if (current < rounds.length - 1) {
    current++;
    renderProgress();
    renderRounds();
    if (current === rounds.length - 1) {
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('resetBtn').style.display = 'inline-block';
    }
  }
});

document.getElementById('resetBtn').addEventListener('click', () => {
  current = 0;
  for (let i = 0; i < answers.length; i++) answers[i] = '';
  document.getElementById('nextBtn').style.display = 'inline-block';
  document.getElementById('resetBtn').style.display = 'none';
  renderProgress();
  renderRounds();
});

renderProgress();
renderRounds();
</script>

</body>
</html>
